[package]
name = "openlingo-desktop"
version = "0.1.0"
edition = "2024"
description = "OpenLingo desktop app rebuilt in Rust"

[dependencies]
eframe = { version = "0.33", default-features = true }
egui = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "6"
rfd = "0.15"

[profile.release]
opt-level = 2
