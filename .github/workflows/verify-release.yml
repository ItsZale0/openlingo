name: Verify release

# Verifica che un tag v* sia costruibile e coerente con version.properties.
# NON pubblica nulla: la release (APK firmato, zip desktop, exe) viene creata
# dal processo di rilascio del maintainer, così l'APK distribuito conserva la
# stessa firma e lo stesso SHA-256 dichiarato in updates/version.json.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify version and tag
        run: |
          CODE=$(grep -oP '^VERSION_CODE=\K[0-9]+' version.properties)
          NAME=$(grep -oP '^VERSION_NAME=\K[0-9]+\.[0-9]+\.[0-9]+' version.properties)
          JSON_CODE=$(jq -r '.versionCode' updates/version.json)
          JSON_NAME=$(jq -r '.versionName' updates/version.json)
          test "$CODE" = "$JSON_CODE" || { echo "::error::versionCode non allineato"; exit 1; }
          test "$NAME" = "$JSON_NAME" || { echo "::error::versionName non allineato"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$NAME" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME non corrisponde a v$NAME"; exit 1; }
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK di verifica
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
